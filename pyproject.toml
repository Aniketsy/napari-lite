[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-lite"
version = "0.1.0"
description = "The napari viewer core without the application: layers, canvas and dims sliders. Derived from napari (BSD-3)."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Aniket Singh Yadav" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Every package below is imported by a copied module (VENDORED.json,
# "third_party_imports").  dask, cachey and psutil are in the [dask] extra:
# the core imports them only when the data is a dask array.  wrapt,
# scikit-image and scipy are listed there too: rewrite rules
# (tools/vendor.toml) put own numpy code in their place
# (utils/_object_proxy.py, _draw.py, _colorconv.py, _rotation.py,
# _linalg.py, _morphology.py, _tracks_index.py); scipy stays an extra for
# spline-interpolated shapes.
dependencies = [
    "numpy>=1.25",
    "vispy>=0.17.0,<0.18",
    "PyOpenGL>=3.1.10",
    "qtpy>=2.4.0",
    "superqt>=0.7.8",
    "psygnal>=0.14.2",
    "pydantic>=2.8.0",
    "pydantic-extra-types",  # Color in utils/theme.py
    "pint>=0.17",
    "Pillow>=10.0",
    "imageio>=2.20,!=2.22.1",
    "lazy_loader>=0.3",
    "packaging",
    "toolz>=0.12.1",
    "tqdm>=4.56.0",
    "typing_extensions>=4.12",
    # pandas: Points, Shapes, Labels, Vectors and Tracks keep their features
    # in a DataFrame, so it is needed as soon as one of them is created;
    # it is imported on first use
    "pandas>=1.5.0",
]

[project.scripts]
napari-lite = "napari_lite.__main__:main"

[project.urls]
Source = "https://github.com/Aniketsy/napari-lite"
Changelog = "https://github.com/Aniketsy/napari-lite/blob/main/CHANGELOG.md"
"Upstream (napari)" = "https://github.com/napari/napari"
"napari issue 5940" = "https://github.com/napari/napari/issues/5940"

[project.optional-dependencies]
pyqt6 = [
    "PyQt6>=6.7",
    "pyqt6-qt6!=6.11.0,!=6.11.1",
]
pyside6 = [
    "PySide6>=6.7,!=6.11.0,!=6.11.1",
]
# viewing dask arrays (opportunistic cache, task fusion off while slicing)
dask = ["dask[array]>=2022.1.1", "cachey>=0.2.1", "psutil>=5.9.4"]
# spline interpolation of shapes (interpolation_order > 1)
scipy = ["scipy>=1.14.0"]
# faster Shapes triangulation and Labels color mapping
fast-shapes = [
    "numba>=0.58.0",
    "PartSegCore-compiled-backend>=0.15.11",
    "bermuda>=0.1.5",
    "triangle; python_version <= '3.13'",
]
tiff = ["tifffile>=2022.7.28"]
all = ["napari-lite[pyqt6,scipy,dask,fast-shapes,tiff]"]
dev = [
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
    "hypothesis>=6.8.0",
    "docstring_parser>=0.15",  # copied napari tests (utils/_test_utils.py)
    "xarray>=2023.5.0",  # copied napari tests import it at module level
    "zarr>=3.0.8",  # copied napari tests import it at module level
    # copied napari tests import them; the comparison tests of the own numpy
    # code (utils/_draw.py, _colorconv.py, _rotation.py, _linalg.py,
    # _morphology.py, _tracks_index.py) run against them
    "scikit-image>=0.20.0",
    "scipy>=1.14.0",
    "matplotlib>=3.6.1",  # vispy's get_colormap falls back to matplotlib names
    "pydantic-settings",  # utils/events/debugging: event tracing for developers
    "napari-lite[dask]",  # the copied dask tests
    "npe2>=0.9.0",  # two copied test modules import it (their plugin tests skip)
    "ruff",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

# namespaces: the icon and stylesheet folders have no __init__.py; without
# this setuptools warns that it may stop shipping them
[tool.setuptools.packages.find]
where = ["src"]
include = ["napari_lite*"]
exclude = ["*__pycache__*"]
namespaces = true

# Non-Python files in the package: the template read by utils/_register.py,
# napari's icons and the stylesheet (themed icons are generated at run time).
[tool.setuptools.package-data]
napari_lite = [
    "utils/*.py_tmpl",
    "resources/icons/*.svg",
    "resources/*.gif",
    "resources/*.ico",
    "resources/*.icns",
    "_qt/qt_resources/styles/*.qss",
]

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--strict-markers", "--strict-config", "--durations=10"]
# own tests, then the copied napari tests (configured by src/napari_lite/conftest.py)
testpaths = ["tests", "src/napari_lite"]
xfail_strict = true
filterwarnings = [
    "error:::napari_lite",
    "error:::test_.*",
    "ignore:data shape .* exceeds GL_MAX_TEXTURE_SIZE:UserWarning",
    "ignore:For best performance with Dask arrays in napari:UserWarning:",
    "ignore:numpy.ufunc size changed:RuntimeWarning",
    "ignore:Multiscale rendering is only supported in 2D. In 3D, only the lowest resolution scale is displayed",
    "ignore:Alternative shading modes are only available in 3D, defaulting to none",
    "ignore:There is no current event loop:DeprecationWarning:",
    "ignore:__array__ implementation doesn't accept a copy keyword, so passing copy=False failed.",
]
# same markers as napari, so the copied tests collect
markers = [
    "examples: Test of examples",
    "disable_qthread_start: Disable thread start in this Test",
    "disable_qthread_pool_start: Disable strarting QRunnable using QThreadPool start in this Test",
    "disable_qtimer_start: Disable timer start in this Test",
    "disable_qanimation_start: Disable animation start in this Test",
    "allow_animation_thread: Allow animation thread to run in this Test (normally disabled to prevent segfaults)",
    "enable_console: Don't mock the IPython console (in QtConsole) in this Test",
    "slow: mark a test as slow",
    "key_bindings: Test of keybindings",
    "show_qt_viewer: Show the QtViewer in this Test",
]

[tool.ruff]
line-length = 79
# Copied napari code keeps napari's formatting; only own code is linted.
extend-exclude = ["src/napari_lite", "*.ipynb", "*.md"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B", "C4", "SIM", "RUF", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T20"]
"bench/**" = ["T20"]
"spikes/**" = ["T20"]
"examples/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["napari_lite"]
combine-as-imports = true
