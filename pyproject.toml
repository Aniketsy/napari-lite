[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-lite"
version = "0.0.1.dev0"
description = "The napari viewer core without the application: layers, canvas and dims sliders. Derived from napari (BSD-3)."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Aniket Singh Yadav" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Every package below is imported by a copied module (VENDORED.json,
# "third_party_imports").  Lines marked TEMP are removed by the issue named
# in the comment; issue 19 removes the last of them.
dependencies = [
    "numpy>=1.25",
    "scipy>=1.14.0",
    "vispy>=0.17.0,<0.18",
    "PyOpenGL>=3.1.10",
    "qtpy>=2.4.0",
    "superqt>=0.7.8",
    "psygnal>=0.14.2",
    "pydantic>=2.8.0",
    "pint>=0.17",
    "Pillow>=10.0",
    "imageio>=2.20,!=2.22.1",
    "lazy_loader>=0.3",
    "packaging",
    "toolz>=0.12.1",
    "tqdm>=4.56.0",
    "typing_extensions>=4.12",
    "wrapt>=1.14.1",
    "app-model>=0.5.0,<0.6.0",  # TEMP issue 17: only key enums are used
    "magicgui>=0.7.0",  # TEMP issue 08
    "npe2>=0.9.0",  # TEMP issue 07
    "dask[array]>=2022.1.1",  # TEMP issue 18: moves to the [dask] extra
    "pandas>=1.5.0",  # TEMP issue 18: moves to the [features] extra
    "scikit-image>=0.20.0",  # TEMP issue 18: shapes utils only
    "psutil>=5.9.4",  # TEMP issue 18: dask cache size in utils/_dask_utils
    "pydantic-settings",  # TEMP issue 09: utils/events/debugging
]

[project.urls]
Source = "https://github.com/Aniketsy/napari-lite"
"Upstream (napari)" = "https://github.com/napari/napari"
"napari issue 5940" = "https://github.com/napari/napari/issues/5940"

[project.optional-dependencies]
pyqt6 = [
    "PyQt6>=6.7",
    "pyqt6-qt6!=6.11.0,!=6.11.1",
]
pyside6 = [
    "PySide6>=6.7,!=6.11.0,!=6.11.1",
]
dask = ["dask[array]>=2022.1.1", "psutil>=5.9.4"]
features = ["pandas>=1.5.0"]
fast-shapes = [
    "numba>=0.58.0",
    "PartSegCore-compiled-backend>=0.15.11",
    "bermuda>=0.1.5",
    "triangle; python_version <= '3.13'",
]
tiff = ["tifffile>=2022.7.28"]
all = ["napari-lite[pyqt6,dask,features,fast-shapes,tiff]"]
dev = [
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
    "hypothesis>=6.8.0",
    "docstring_parser>=0.15",  # copied napari tests (utils/_test_utils.py)
    "ruff",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
napari_lite = [
    "resources/icons/*.svg",
    "resources/*.gif",
    "resources/*.ico",
    "resources/*.icns",
    "_qt/qt_resources/styles/*.qss",
]

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error:::napari_lite",
    "error:::test_.*",
]
markers = [
    "slow: mark a test as slow",
]

[tool.ruff]
line-length = 79
# Copied napari code keeps napari's formatting; only own code is linted.
extend-exclude = ["src/napari_lite"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B", "C4", "SIM", "RUF", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T20"]
"bench/**" = ["T20"]
"spikes/**" = ["T20"]
"examples/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["napari_lite"]
combine-as-imports = true
