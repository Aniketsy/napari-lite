name: Benchmarks

# Import time, time to first image and first frame, first layers, slice
# stepping and painting, napari-lite against napari, on the three OSes.
# Each package is installed in its own fresh environment; the results are
# uploaded as JSON and summarized as a table in the job summary, with the
# README's block from the Linux numbers (tools/readme_bench.py).
# Run by hand or weekly; nothing is committed automatically.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

jobs:
  bench:
    name: ${{ matrix.package }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [napari_lite, napari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install napari-lite
        if: matrix.package == 'napari_lite'
        run: |
          python -m pip install -U pip
          python -m pip install ".[pyqt6]"
      - name: Install napari
        if: matrix.package == 'napari'
        run: |
          python -m pip install -U pip
          python -m pip install "napari[pyqt6]"
      - name: Record the installed size and package count
        shell: bash
        run: python bench/install_size.py --json "size-${{ matrix.package }}-${{ matrix.os }}.json"
      - name: Benchmark
        shell: bash
        run: |
          python bench/bench_imports.py --package ${{ matrix.package }} --repeat 5 \
            --json "bench-${{ matrix.package }}-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.package }}-${{ matrix.os }}
          path: |
            bench-*.json
            size-*.json

  table:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Table
        shell: bash
        run: |
          python bench/make_table.py --median results/*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: README block (Linux numbers; tools/readme_bench.py writes it into README.md)
        shell: bash
        run: |
          echo "### README block" >> "$GITHUB_STEP_SUMMARY"
          python tools/readme_bench.py --results results --print | tee -a "$GITHUB_STEP_SUMMARY"
