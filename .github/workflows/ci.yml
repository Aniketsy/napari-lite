name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev,pyqt6]
      - name: napari must not be installed
        shell: bash
        run: |
          if python -m pip show napari >/dev/null 2>&1; then
            echo "napari is installed; napari-lite must be tested without it" >&2
            exit 1
          fi
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
