# utils/_xarray_utils.py: every layer checks whether its data is an xarray
# object by importing xarray, which imports pandas; with xarray installed
# the first image paid about a second and 450 modules for nothing.  An
# xarray object can only exist once xarray is in sys.modules.
[[rewrite]]
