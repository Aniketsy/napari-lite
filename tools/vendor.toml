# pint off the first image.  napari gives every layer pint's pixel unit by
# default, which imports pint (0.6 s, 340 modules) and builds its registry
# (0.2 s) at the first image of every session: half of the first image.
# utils/_pixel.py has PIXEL, a str equal to 'pixel' and to pint's pixel unit
# that hands anything else to pint on demand; the rules below hand it out
# as the default, keep pint behind TYPE_CHECKING where it is only a type,
# and take the equal-units fast paths (the pixel default, in most sessions)
# without a registry.  pint arrives with the first real unit.  The registry
# then comes from pint's definition cache (utils/_units.py).

