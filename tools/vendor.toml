    "napari.settings",
    "napari.plugins",
    "napari._app_model",
    "napari.utils.theme",
    "napari.utils.action_manager",
    "napari.utils._magicgui",
    "napari.utils.info",
    "napari.utils.notebook_display",
    "napari._qt._qapp_model",
    "napari._qt.qt_main_window",
    "napari._qt.qt_event_loop",
    "napari._qt.perf",
    "napari.viewer",
    "napari.window",
    "napari.view_layers",
    "napari._event_loop",
]

# Copied in addition to what the crawl reaches (issue 21 adds the layer
# list and layer controls here).
extra_modules = []

# Never copied, never reported.  ``napari._tests`` holds napari's
# application-level tests (Viewer, Window, examples).
skip_modules = [
    "napari.benchmarks",
    "napari._tests",
]

# Copied paths that ``main`` has replaced with own code (exact module names,
# e.g. "napari.utils" for utils/__init__.py).  Not written, imports of them
# are not crossings, their own imports are not followed.  Edit this list on
# the ``vendor`` branch together with the pin (see SYNC.md).
own_modules = []

# Non-Python files, globs relative to ``src/napari``.
data = [
    "resources/icons/*.svg",
    "resources/loading.gif",
    "resources/icon.ico",
    "resources/icon.icns",
]

