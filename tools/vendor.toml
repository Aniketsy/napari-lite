# Never copied, never reported.  ``napari._tests`` holds napari's
# application-level tests (Viewer, Window, examples).
skip_modules = [
    "napari.benchmarks",
    "napari._tests",
]

# Copied paths that ``main`` has replaced with own code (exact module names,
# e.g. "napari.utils" for utils/__init__.py).  Not written, imports of them
# are not crossings, their own imports are not followed.  Edit this list on
# the ``vendor`` branch together with the pin (see SYNC.md).
own_modules = [
    "napari",           # __init__.py: issue 03
    "napari._version",  # generated by setuptools_scm in napari; own file here
    "napari.utils",     # utils/__init__.py: lazy, issue 09
    "napari._qt",       # _qt/__init__.py: no main window import, issue 10
]

# Non-Python files, globs relative to ``src/napari``; copied only when the
# package that holds them is copied.
data = [
    "utils/add_layer.py_tmpl",  # template read by utils/_register.py
    "resources/icons/*.svg",
    "resources/loading.gif",
    "resources/icon.ico",
    "resources/icon.icns",
]

# Plain text substitutions applied after the ``napari`` -> ``napari_lite``
# rewrite.  Issue 17 maps ``from app_model.types import`` to a local module.
[literal_rewrites]
# utils/_register.py hands the package to the generated add_* methods under
# its own name; the generic rewrite leaves bare 'napari' strings alone.
"'napari': sys.modules.get('napari')" = "'napari_lite': sys.modules.get('napari_lite')"
# utils/events/event.py runs the package's own callbacks before user
# callbacks; it recognizes them by module prefix.
"self._is_core_callback(c, 'napari')" = "self._is_core_callback(c, 'napari_lite')"
"self._is_core_callback(callback, 'napari')" = "self._is_core_callback(callback, 'napari_lite')"
